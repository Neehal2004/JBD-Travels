services:
  # -----------------------------------------------------------
  # 1. JBD Travels Backend (Flask REST API Web Service)
  # -----------------------------------------------------------
  - type: web
    name: jbd-travels-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python seeds/seed_data.py"
    startCommand: "gunicorn run:app"
    plan: free
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8

  # -----------------------------------------------------------
  # 2. JBD Travels Frontend (React SPA Static Site)
  # -----------------------------------------------------------
  - type: web
    name: jbd-travels-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: "./frontend"
    plan: free
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
